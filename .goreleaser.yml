version: 2

project_name: tslink

# Release construction is read-only. `go mod tidy` is intentionally NOT
# a before-hook: it can mutate the tagged worktree. The release-candidate
# workflow proves the tree is already tidy before packaging; only read-only
# checks run here.
before:
  hooks:
    - go vet ./...

builds:
  - id: tslink
    main: .
    binary: tslink
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Embed version and the exact VCS commit so provenance ties an artifact to
    # the tagged source. mod_timestamp pins the build epoch to the commit for
    # reproducible archives.
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.FullCommit}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: archive
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # The legal payload travels inside every tar/zip.
    files:
      - LICENSE
      - LICENSE-POLYFORM-SMALL-BUSINESS-1.0.0
      - LICENSE-APACHE-2.0
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - COMMERCIAL.md
      - COMMERCIAL_zh.md

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.sbom.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
  - id: sboms
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: sbom

nfpms:
  - id: linux-packages
    ids:
      - tslink
    package_name: tslink
    vendor: monody0007
    homepage: "https://github.com/monody0007/tslink"
    maintainer: "Maintainer <monody0007@users.noreply.github.com>"
    description: "Private Tailscale gateway for local services"
    license: "LicenseRef-TSLink-Community-1.0"
    formats:
      - deb
      - rpm
    # Conventional deb/rpm documentation paths carry the legal set.
    contents:
      - src: LICENSE
        dst: /usr/share/doc/tslink/LICENSE
        file_info:
          mode: 0644
      - src: LICENSE-POLYFORM-SMALL-BUSINESS-1.0.0
        dst: /usr/share/doc/tslink/LICENSE-POLYFORM-SMALL-BUSINESS-1.0.0
        file_info:
          mode: 0644
      - src: LICENSE-APACHE-2.0
        dst: /usr/share/doc/tslink/LICENSE-APACHE-2.0
        file_info:
          mode: 0644
      - src: COMMERCIAL.md
        dst: /usr/share/doc/tslink/COMMERCIAL.md
        file_info:
          mode: 0644
      - src: COMMERCIAL_zh.md
        dst: /usr/share/doc/tslink/COMMERCIAL_zh.md
        file_info:
          mode: 0644
      - src: NOTICE
        dst: /usr/share/doc/tslink/NOTICE
        file_info:
          mode: 0644
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/tslink/THIRD_PARTY_NOTICES.md
        file_info:
          mode: 0644

# Homebrew publishing via cask. GoReleaser deprecated the `brews` formula key;
# `homebrew_casks` is the supported replacement (requires GoReleaser >= 2.11,
# pinned to v2.17.0 in the workflows). `skip_upload: auto` skips pre-release
# tags and snapshots never upload. The tap must be initialized/protected before
# a stable release; that readback remains an external gate.
homebrew_casks:
  - name: tslink
    repository:
      owner: monody0007
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/monody0007/tslink"
    description: "Private Tailscale gateway for local services"
    skip_upload: auto
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
