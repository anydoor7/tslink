version: 2

project_name: tslink

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - main: .
    binary: tslink
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: tslink
    binaries:
      - tslink
    repository:
      owner: monody0007
      name: homebrew-tap
      branch: main
    directory: Casks
    homepage: "https://github.com/monody0007/tslink"
    description: "Zero-trust service gateway for Tailscale — expose local services to your private network"
    license: "Apache-2.0"
    skip_upload: auto
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
