version: 2

project_name: tslink

# Release construction is read-only. `go mod tidy` is intentionally NOT
# a before-hook: it can mutate the tagged worktree. The release-candidate
# workflow proves the tree is already tidy before packaging; only read-only
# checks run here.
before:
  hooks:
    - go vet ./...

builds:
  - id: tslink
    main: .
    binary: tslink
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Embed version and the exact VCS commit so provenance ties an artifact to
    # the tagged source. mod_timestamp pins the build epoch to the commit for
    # reproducible archives.
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.FullCommit}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: archive
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # The licence files and project documents travel inside every tar/zip.
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - COMMERCIAL.md
      - COMMERCIAL_zh.md

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.sbom.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
  - id: sboms
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: sbom

# macOS code signing + notarization (Developer ID). Runs inside GoReleaser via
# quill, so it works on the Linux release runner. Enabled only when the
# certificate is present in the environment: snapshot and pre-release builds
# without the secrets produce unsigned binaries, which never reach the cask
# because release.yml refuses stable tags without them. Values:
# MACOS_SIGN_P12 = base64 PKCS#12 of the
# "Developer ID Application" identity, MACOS_SIGN_P12_PASSWORD = its password,
# MACOS_NOTARY_ISSUER_ID / MACOS_NOTARY_KEY_ID / MACOS_NOTARY_KEY = an App
# Store Connect API team key (the .p8 file, base64-encoded) with the Developer role.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - tslink
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_P12_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        # Deliberately wait: a stable release must not ship until Apple has
        # issued the ticket (measured 46 s locally; 20m is the config maximum).
        wait: true
        timeout: 20m
nfpms:
  - id: linux-packages
    ids:
      - tslink
    package_name: tslink
    vendor: anydoor7
    homepage: "https://github.com/anydoor7/tslink"
    maintainer: "anydoor7 project maintainers"
    description: "Private Tailscale gateway for local services"
    license: "Apache-2.0"
    formats:
      - deb
      - rpm
    # Conventional deb/rpm documentation paths carry those same files.
    contents:
      - src: LICENSE
        dst: /usr/share/doc/tslink/LICENSE
        file_info:
          mode: 0644
      - src: COMMERCIAL.md
        dst: /usr/share/doc/tslink/COMMERCIAL.md
        file_info:
          mode: 0644
      - src: COMMERCIAL_zh.md
        dst: /usr/share/doc/tslink/COMMERCIAL_zh.md
        file_info:
          mode: 0644
      - src: NOTICE
        dst: /usr/share/doc/tslink/NOTICE
        file_info:
          mode: 0644
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/tslink/THIRD_PARTY_NOTICES.md
        file_info:
          mode: 0644

# Homebrew publishing via cask. GoReleaser deprecated the `brews` formula key;
# `homebrew_casks` is the supported replacement (requires GoReleaser >= 2.11,
# pinned to v2.17.0 in the workflows). `skip_upload: auto` skips pre-release
# tags and snapshots never upload. The tap must be initialized/protected before
# a stable release; that readback remains an external gate.
homebrew_casks:
  - name: tslink
    repository:
      owner: anydoor7
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/anydoor7/tslink"
    description: "Private Tailscale gateway for local services"
    skip_upload: auto
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    # The darwin binaries are Developer ID signed and notarized by Apple (see
    # `notarize` below), so Gatekeeper runs them straight from the quarantined
    # cask download: measured 2026-09-22 on a clean Mac mini, first run of the
    # notarized binary with com.apple.quarantine still attached exits 0 at
    # once (syspolicyd evaluateScanResult 1), while the earlier unsigned build
    # hung until killed (result 2, a prompt nobody can answer over SSH). No
    # postflight quarantine strip is needed; release.yml refuses stable tags
    # without the signing secrets so an unsigned cask can never be published.
    # Templated: the same config renders a snapshot/pre-release cask without
    # the secrets, whose binary is unsigned, and the caveats must say so.
    caveats: |
      {{- if isEnvSet "MACOS_SIGN_P12" }}
      tslink is signed with a Developer ID certificate and notarized by Apple.
      The first run needs network access so macOS can look up the notarization
      ticket: a bare binary cannot carry a stapled ticket.
      {{- else }}
      This build is not signed or notarized (snapshot or pre-release), so macOS
      Gatekeeper will block it. Install a stable release instead, or allow this
      binary with:
        xattr -d com.apple.quarantine "$(readlink -f "$(command -v tslink)")"
      {{- end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
