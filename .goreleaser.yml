version: 2

project_name: tslink

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: tslink
    main: .
    binary: tslink
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: archive
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.sbom.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
  - id: sboms
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: sbom

nfpms:
  - id: linux-packages
    ids:
      - tslink
    package_name: tslink
    vendor: monody0007
    homepage: "https://github.com/monody0007/tslink"
    maintainer: "Maintainer <monody0007@users.noreply.github.com>"
    description: "Private Tailscale gateway for local services"
    license: "Apache-2.0"
    formats:
      - deb
      - rpm

brews:
  - name: tslink
    ids:
      - archive
    repository:
      owner: monody0007
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/monody0007/tslink"
    description: "Private Tailscale gateway for local services"
    license: "Apache-2.0"
    skip_upload: auto
    install: |
      bin.install "tslink"
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
