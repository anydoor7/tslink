name: Release Candidate

# Reusable exact-SHA gate: main/tags are full; PR policy comes from the base.
# Called by ci.yml on pull requests and pushes to main, and by release.yml on
# tags.

on:
  workflow_call:
    inputs:
      ref:
        description: Immutable commit SHA to gate. Defaults to the caller's SHA.
        required: false
        type: string
        default: ${{ github.sha }}

permissions:
  contents: read

env:
  # Recorded deterministic shuffle seeds. The first seed is the
  # historically failing seed kept as a regression anchor. Changing this list
  # is an intentional re-recording, not an incidental edit.
  TSLINK_SHUFFLE_SEEDS: "1783794398036981000 20260712 424242"
  # Pinned analysis tool versions. CI stays deterministic; the vulnerability
  # database itself is still fetched fresh at run time (see the govulncheck
  # jobs) because the advisory set is time-dependent.
  STATICCHECK_VERSION: v0.7.0
  GOVULNCHECK_VERSION: v1.6.0
  TSLINK_RELEASE_TARGETS: "darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64"

jobs:
  tier:
    name: Choose CI tier
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      runners: ${{ steps.classify.outputs.runners }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
          path: pr-data
      - name: Check out trusted base policy
        if: github.event_name == 'pull_request'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: trusted-base
      - name: Classify immutable PR base/head trees
        id: classify
        env:
          CI_PR_TIER_MODE: ${{ vars.CI_PR_TIER_MODE || 'tiered' }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = pull_request ] && [ -f "${GITHUB_WORKSPACE}/trusted-base/.github/scripts/ci-tier.py" ]; then
            python3 -I "${GITHUB_WORKSPACE}/trusted-base/.github/scripts/ci-tier.py" --repo "${GITHUB_WORKSPACE}/pr-data"
          else
            # Bootstrap has no base policy yet; main and tags are always full.
            echo '{"tier":"full","reason":"main/tag or trusted base policy unavailable","runners":["ubuntu-latest","macos-latest","windows-latest"]}'
            echo 'tier=full' >> "${GITHUB_OUTPUT}"
            echo 'runners=["ubuntu-latest","macos-latest","windows-latest"]' >> "${GITHUB_OUTPUT}"
            echo '## CI tier: full' >> "${GITHUB_STEP_SUMMARY}"
            echo 'Reason: main/tag or trusted base policy unavailable.' >> "${GITHUB_STEP_SUMMARY}"
          fi

  policy-tests:
    name: Test proposed CI policy (non-authoritative)
    runs-on: ubuntu-latest
    needs: tier
    if: needs.tier.outputs.tier == 'go' || needs.tier.outputs.tier == 'full'
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Test CI policy without Go or network
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci_tier.py' -v

  native:
    name: Native build/vet/test/race (${{ matrix.os }})
    needs: tier
    if: needs.tier.outputs.tier == 'go' || needs.tier.outputs.tier == 'full'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.tier.outputs.runners) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Generate native CLI manifest evidence
        shell: bash
        run: |
          set -euo pipefail
          go run ./tools/gen-manifest -output "${RUNNER_TEMP}/cli-manifest.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-manifest-${{ matrix.os }}
          path: ${{ runner.temp }}/cli-manifest.json
          if-no-files-found: error
      - name: CLI manifest fixture is current (Darwin)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          output="$(go run ./tools/gen-manifest -check)"
          printf '%s\n' "${output}"
          test "${output}" = "gen-manifest: docs/cli-manifest.json is up to date"
      - name: Test
        run: go test -count=1 ./...
      - name: Race
        run: go test -race -count=1 ./...
      - name: Recorded deterministic shuffle
        shell: bash
        run: |
          set -euo pipefail
          for seed in ${TSLINK_SHUFFLE_SEEDS}; do
            echo "::group::shuffle seed ${seed}"
            go test -count=1 -shuffle="${seed}" ./...
            echo "::endgroup::"
          done
      - name: Native CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          bin="dist/native/tslink"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            bin="${bin}.exe"
          fi
          mkdir -p dist/native
          go build -trimpath -o "${bin}" .
          commands=(
            "--help" "--version" "--version --json" "login --help" "logout --help" "add --help"
            "remove --help" "list --help" "serve --help" "stop --help"
            "status --help" "logs --help" "config --help"
            "config set --help" "config get --help" "config list --help"
            "tags --help" "tags list --help" "tags pull --help" "tags add --help"
            "tags set --help" "tags set-default --help" "tags delete-remote --help"
            "install --help" "uninstall --help"
            "share --help" "url --help" "cleanup --help" "doctor --help"
            "access --help" "access explain --help" "manifest --help"
            "template --help" "template list --help" "template show --help"
            "template apply --help" "mcp --help"
            "invite --help" "invite user --help" "invite device --help"
            "invite list --help" "invite revoke --help" "invite resend --help"
            "registry --help" "registry check --help"
          )
          for command in "${commands[@]}"; do
            read -r -a args <<< "${command}"
            "${bin}" "${args[@]}" >/dev/null
          done
      - name: Windows Task Scheduler lifecycle smoke
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: ./scripts/windows-supervision-smoke.ps1 -Binary ./dist/native/tslink.exe
      - name: Coverage (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -race -coverprofile=coverage.out
          go tool cover -func=coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          threshold="85.0"
          awk -v total="${total}" -v threshold="${threshold}" 'BEGIN {
            if (total + 0 < threshold + 0) {
              printf "coverage %.1f%% is below %.1f%%\n", total, threshold
              exit 1
            }
            printf "coverage %.1f%% meets %.1f%%\n", total, threshold
          }'

  manifest-platform-diff:
    name: Three-platform CLI manifest mark proof
    runs-on: ubuntu-latest
    needs: [tier, native]
    if: needs.tier.outputs.tier == 'full'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-manifest-*
          path: downloaded-manifests
      - name: Assert native flag divergence equals declared marks
        run: |
          go run ./tools/check-manifest-platforms \
            -darwin downloaded-manifests/cli-manifest-macos-latest/cli-manifest.json \
            -linux downloaded-manifests/cli-manifest-ubuntu-latest/cli-manifest.json \
            -windows downloaded-manifests/cli-manifest-windows-latest/cli-manifest.json

  machine-contract:
    name: Compiled-binary machine contracts
    needs: tier
    if: needs.tier.outputs.tier == 'go' || needs.tier.outputs.tier == 'full'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.tier.outputs.runners) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      # These tests build the real binary and assert stdout/exit-code contracts
      # (aggregate exit, doctor/machine JSON envelopes). They compile
      # and run on every native OS so shell/exit differences are caught.
      # Anchored to ^TestCompiled so EVERY compiled contract runs; a narrower
      # substring selector previously skipped 5 of 7 TestCompiled* tests.
      # TestCompiledSelectorCoversAllCompiledTests enforces this selector.
      - name: Machine-contract binary tests
        run: go test -count=1 -run '^TestCompiled' ./cmd/...

  staticcheck:
    name: Staticcheck (linux, darwin, windows)
    needs: tier
    if: needs.tier.outputs.tier == 'go' || needs.tier.outputs.tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      - name: Staticcheck
        run: |
          set -euo pipefail
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          failed=0
          for target in linux darwin windows; do
            echo "::group::staticcheck ${target}"
            GOOS="${target}" "$(go env GOPATH)/bin/staticcheck" ./... || failed=$?
            echo "::endgroup::"
          done
          exit "${failed}"

  # Independent main and repo vulnerability jobs. They intentionally do NOT
  # depend on staticcheck or on each other so one failure cannot suppress the
  # other. Each archives its full report as an artifact.
  govulncheck-main:
    name: govulncheck (main module)
    runs-on: ubuntu-latest
    needs: tier
    if: needs.tier.outputs.tier == 'go' || needs.tier.outputs.tier == 'full'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      - name: govulncheck .
        run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" -show verbose . | tee govulncheck-main.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: govulncheck-main
          path: govulncheck-main.txt
          if-no-files-found: warn

  govulncheck-repo:
    name: govulncheck (all six release targets)
    runs-on: ubuntu-latest
    needs: tier
    if: needs.tier.outputs.tier == 'go' || needs.tier.outputs.tier == 'full'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      - name: govulncheck ./...
        shell: bash
        run: |
          set -euo pipefail
          env -u GOOS -u GOARCH -u CGO_ENABLED go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          failed=0
          for target in ${TSLINK_RELEASE_TARGETS}; do
            echo "::group::govulncheck ${target}"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 "$(go env GOPATH)/bin/govulncheck" -show verbose ./... | tee "govulncheck-repo-${target%/*}-${target#*/}.txt" || failed=$?
            echo "::endgroup::"
          done
          exit "${failed}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: govulncheck-repo-darwin-amd64
          path: govulncheck-repo-darwin-amd64.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: govulncheck-repo-darwin-arm64
          path: govulncheck-repo-darwin-arm64.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: govulncheck-repo-linux-amd64
          path: govulncheck-repo-linux-amd64.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: govulncheck-repo-linux-arm64
          path: govulncheck-repo-linux-arm64.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: govulncheck-repo-windows-amd64
          path: govulncheck-repo-windows-amd64.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: govulncheck-repo-windows-arm64
          path: govulncheck-repo-windows-arm64.txt
          if-no-files-found: warn

  reproducible-source:
    name: gofmt + tidy-diff (read-only source proof)
    runs-on: ubuntu-latest
    needs: tier
    if: needs.tier.outputs.tier == 'go' || needs.tier.outputs.tier == 'full'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error::gofmt needs to be run on:"; echo "${unformatted}"
            exit 1
          fi
      # Prove `go mod tidy` is a no-op on the tagged tree BEFORE any packaging.
      # This replaces the removed GoReleaser `go mod tidy` before-hook:
      # the release must never mutate source; it only verifies it is already tidy.
      - name: go mod tidy diff
        run: |
          set -euo pipefail
          cp go.mod go.mod.orig
          cp go.sum go.sum.orig
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go mod tidy changed go.mod/go.sum; commit the tidy result"
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi
          rm -f go.mod.orig go.sum.orig
      - name: Working tree is clean after tidy
        run: git diff --exit-code

  cross-build:
    name: Cross build (all six release targets)
    runs-on: ubuntu-latest
    needs: tier
    if: needs.tier.outputs.tier == 'go' || needs.tier.outputs.tier == 'full'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      - name: Build + stage license payload
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for target in ${TSLINK_RELEASE_TARGETS}; do
            echo "::group::cross build ${target}"
            ext=""
            if [ "${target%/*}" = "windows" ]; then ext=".exe"; fi
            out="dist/cross/tslink-${target%/*}-${target#*/}"
            mkdir -p "${out}"
            if GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.commit=${GITHUB_SHA}" -o "${out}/tslink${ext}" .; then
              cp LICENSE NOTICE THIRD_PARTY_NOTICES.md COMMERCIAL.md "${out}/"
            else
              failed=$?
            fi
            echo "::endgroup::"
          done
          exit "${failed}"
      - name: Smoke native artifact
        run: ./dist/cross/tslink-linux-amd64/tslink --help >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tslink-darwin-amd64
          path: dist/cross/tslink-darwin-amd64/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tslink-darwin-arm64
          path: dist/cross/tslink-darwin-arm64/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tslink-linux-amd64
          path: dist/cross/tslink-linux-amd64/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tslink-linux-arm64
          path: dist/cross/tslink-linux-arm64/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tslink-windows-amd64
          path: dist/cross/tslink-windows-amd64/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tslink-windows-arm64
          path: dist/cross/tslink-windows-arm64/*
          if-no-files-found: error

  artifact-verify:
    name: Artifact download + hash + content verify
    runs-on: ubuntu-latest
    needs: [tier, cross-build]
    if: needs.tier.outputs.tier == 'go' || needs.tier.outputs.tier == 'full'
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tslink-*
          path: downloaded
      - name: Verify content, license payload, and hashes
        shell: bash
        run: |
          set -euo pipefail
          required_license=(LICENSE NOTICE THIRD_PARTY_NOTICES.md)
          bundled_documents=(COMMERCIAL.md)
          expected=(darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64 windows-arm64)
          for t in "${expected[@]}"; do
            dir="downloaded/tslink-${t}"
            [ -d "${dir}" ] || { echo "::error::missing artifact ${t}"; exit 1; }
            bin="${dir}/tslink"; [ "${t%-*}" = "windows" ] && bin="${dir}/tslink.exe"
            [ -s "${bin}" ] || { echo "::error::empty binary ${t}"; exit 1; }
            for f in "${required_license[@]}" "${bundled_documents[@]}"; do
              [ -s "${dir}/${f}" ] || { echo "::error::missing ${f} in ${t}"; exit 1; }
            done
          done
          ( cd downloaded && find . -type f -exec sha256sum {} + | sort -k2 ) | tee candidate-artifacts.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-artifacts-sha256
          path: candidate-artifacts.sha256
          if-no-files-found: error

  release-config:
    name: GoReleaser config + license/notice presence
    runs-on: ubuntu-latest
    needs: tier
    if: needs.tier.outputs.tier == 'go' || needs.tier.outputs.tier == 'full'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      - name: Required licence and project documents present
        shell: bash
        run: |
          set -euo pipefail
          required_license=(LICENSE NOTICE THIRD_PARTY_NOTICES.md)
          bundled_documents=(COMMERCIAL.md)
          for f in "${required_license[@]}" "${bundled_documents[@]}"; do
            [ -s "${f}" ] || { echo "::error::missing ${f}"; exit 1; }
          done
      - name: Third-party notice inventory is current
        run: go run ./tools/gen-notices -check
      - name: CLI manifest fixture is current (Linux)
        run: go run ./tools/gen-manifest -check
      - name: Workflow pin + graph validator
        run: go test -count=1 ./internal/release/...
      - name: GoReleaser config check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Must be >= 2.11 to parse the `homebrew_casks` config key. v2.9.0
          # hard-fails on that key (`field homebrew_casks not found`), which made
          # this exact-SHA gate deterministically red. Kept identical to the
          # publish pin in release.yml and asserted by TestGoReleaserVersionPins.
          version: v2.17.0
          args: check

  gate:
    name: gate
    if: always()
    runs-on: ubuntu-latest
    needs: [tier, policy-tests, native, manifest-platform-diff, machine-contract, staticcheck, govulncheck-main, govulncheck-repo, reproducible-source, cross-build, artifact-verify, release-config]
    steps:
      # Inline and checkout-free: a failed/cancelled classification or checkout
      # must still produce a failing aggregate, not suppress the required check.
      - name: Require every selected job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          core = {"policy-tests", "native", "machine-contract", "staticcheck", "govulncheck-main",
                  "govulncheck-repo", "reproducible-source", "cross-build",
                  "artifact-verify", "release-config"}
          expected = core | {"tier", "manifest-platform-diff"}
          tier = needs.get("tier", {}).get("outputs", {}).get("tier")
          bad = []
          if set(needs) != expected or tier not in {"draft", "docs", "go", "full"}:
              bad.append("invalid/missing tier or job results")
          required = {"tier"}
          if tier in {"go", "full"}:
              required |= core
          if tier == "full":
              required.add("manifest-platform-diff")
          for name, info in sorted(needs.items()):
              result = info["result"]
              allowed = {"success"} if name in required else {"success", "skipped"}
              print(f"{name}: {result} (required={name in required})")
              if result not in allowed:
                  bad.append(f"{name}: {result}")
          if bad:
              print("Gate failed: " + "; ".join(bad), file=sys.stderr)
              sys.exit(1)
          print(f"Gate passed: {tier}")
          PY
