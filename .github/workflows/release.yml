name: Release

# A v* tag runs the SAME reusable release-candidate gate as PR/main and only
# then publishes. The publish job `needs: candidate`, so a tag cannot publish
# signed/attested artifacts from a commit that failed Windows compilation,
# staticcheck, either govulncheck, cross-build, or artifact verification
# locally. Elevated write/id-token/attestations permissions are granted only
# to the publish job, and the job fails closed unless a repository variable is
# explicitly enabled after external environment/ruleset/reviewer readback.

on:
  push:
    tags: ["v*"]

# Default to read-only for the whole workflow. Elevated scopes live on the
# publish job alone.
permissions:
  contents: read

jobs:
  candidate:
    name: Release candidate gate
    permissions:
      contents: read
    uses: ./.github/workflows/release-candidate.yml
    with:
      ref: ${{ github.sha }}

  publish:
    name: Publish
    needs: candidate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Require repository release authorization
        env:
          TSLINK_RELEASE_PUBLISH_ENABLED: ${{ vars.TSLINK_RELEASE_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${TSLINK_RELEASE_PUBLISH_ENABLED}" != "true" ]; then
            echo "::error::Release publishing is disabled. Enable repository variable TSLINK_RELEASE_PUBLISH_ENABLED=true only after external readback proves the release environment, required reviewers, refs/tags/v* ruleset, branch protection, and Homebrew tap are configured."
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Require Homebrew tap token for stable tags
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_GITHUB_TOKEN}" ]; then
            echo "::error::Stable releases require HOMEBREW_TAP_GITHUB_TOKEN with write access to monody0007/homebrew-tap"
            exit 1
          fi
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.44.0
      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Must be >= 2.11 for the `homebrew_casks` config key and match the
          # version validated by the release-config gate. Kept identical to the
          # release-candidate `release-config` pin and the .goreleaser.yml comment.
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pre-release tags may leave this empty because skip_upload: auto skips
          # tap upload; stable tags are checked above before installing tools.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          # Keep in sync with .goreleaser.yml release assets: installable
          # artifacts, checksums, SBOM sidecars, and Sigstore bundle sidecars.
          subject-path: |
            dist/checksums.txt
            dist/*.sigstore.json
            dist/*.sbom.json
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
