name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      # actions/setup-go v6.4.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - name: Check GoReleaser config
        # goreleaser/goreleaser-action v6.4.0
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          version: v2.9.0
          args: check
      - name: Check Homebrew tap token
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "::error::Stable releases require HOMEBREW_TAP_GITHUB_TOKEN with write access to monody0007/homebrew-tap"
            exit 1
          fi
      - name: Install cosign
        # sigstore/cosign-installer v4.1.2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Install syft
        # anchore/sbom-action v0.24.0
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
        with:
          syft-version: v1.44.0
      - name: Release
        # goreleaser/goreleaser-action v6.4.0
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          version: v2.9.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pre-release tags may leave this empty because skip_upload: auto skips
          # tap upload; stable tags are checked before installing release tools.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Attest release artifacts
        # actions/attest-build-provenance v4.1.0
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          # Keep this in sync with .goreleaser.yml release assets: installable
          # artifacts, checksums, SBOM sidecars, and Sigstore bundle sidecars.
          # Sigstore bundle sidecars are attested so every release-page
          # integrity sidecar carries GitHub provenance.
          subject-path: |
            dist/checksums.txt
            dist/*.sigstore.json
            dist/*.sbom.json
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
