name: Release

# A v* tag runs the FULL reusable release-candidate gate, as main does, and only
# then publishes. PRs are tiered. The publish job `needs: candidate`, so a tag cannot publish
# signed/attested artifacts from a commit that failed Windows compilation,
# staticcheck, either govulncheck, cross-build, or artifact verification
# locally. Elevated write/id-token/attestations permissions are granted only
# to the publish job, and the job fails closed unless a repository variable is
# explicitly enabled after external environment/ruleset/reviewer readback.

on:
  push:
    tags: ["v*"]

# Default to read-only for the whole workflow. Elevated scopes live on the
# publish job alone.
permissions:
  contents: read

jobs:
  candidate:
    name: Release candidate gate
    permissions:
      contents: read
    uses: ./.github/workflows/release-candidate.yml
    with:
      ref: ${{ github.sha }}

  publish:
    name: Publish
    needs: candidate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Only a SemVer version tag without build metadata can publish. GoReleaser
      # reads a pre-release from SemVer's pre-release field, but build
      # metadata may contain hyphens too: v0.1.0+build-1 is a stable version
      # with a hyphen. Without "+", any hyphen in an accepted tag starts the
      # pre-release field, so the steps below that treat hyphenated tags as
      # pre-releases agree with GoReleaser's prerelease: auto and
      # skip_upload: auto.
      - name: Require a SemVer release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Byte ranges: in a UTF-8 locale, [A-Za-z] can also match letters such as é.
          LC_ALL=C
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${identifier}(\.${identifier})*)?$"
          if ! [[ "${TAG}" =~ ${semver} ]]; then
            echo "::error::Tag ${TAG} is not a release version: use vMAJOR.MINOR.PATCH with an optional -pre-release and no +build metadata"
            exit 1
          fi
      - name: Require repository release authorization
        env:
          TSLINK_RELEASE_PUBLISH_ENABLED: ${{ vars.TSLINK_RELEASE_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${TSLINK_RELEASE_PUBLISH_ENABLED}" != "true" ]; then
            echo "::error::Release publishing is disabled. Enable repository variable TSLINK_RELEASE_PUBLISH_ENABLED=true only after external readback proves the release environment, required reviewers, refs/tags/v* ruleset, branch protection, Homebrew tap, Scoop bucket, and winget fork credentials are configured."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The release body is the curated CHANGELOG.md section for the tag's
      # version, not GoReleaser's commit list. Every tag needs exactly one
      # non-empty section, pre-releases included, so a missing one stops the
      # job before anything is published. The file goes to the runner's temp
      # directory: GoReleaser --clean wipes dist/, and an untracked file in
      # the checkout would make GoReleaser refuse a dirty git state.
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          heading="## [${TAG#v}]"
          # Both passes drop a trailing CR, so CRLF lines read like LF lines.
          sections="$(awk -v heading="${heading}" '{ sub(/\r$/, "") } index($0, heading) == 1 { n++ } END { print n + 0 }' CHANGELOG.md)"
          if [ "${sections}" != "1" ]; then
            echo "::error::CHANGELOG.md has ${sections} sections headed ${heading}; tag ${TAG} needs exactly one"
            exit 1
          fi
          # Copy the lines between that heading and the next "## [" heading,
          # dropping blank lines at either end.
          awk -v heading="${heading}" '
            { sub(/\r$/, "") }
            index($0, "## [") == 1 { in_section = index($0, heading) == 1; next }
            !in_section { next }
            /^[ \t]*$/ { if (started) blanks++; next }
            { for (; blanks > 0; blanks--) print ""; print; started = 1 }
          ' CHANGELOG.md > "${RELEASE_NOTES}"
          if [ ! -s "${RELEASE_NOTES}" ]; then
            echo "::error::CHANGELOG.md section ${heading} is empty; tag ${TAG} needs release notes"
            exit 1
          fi
          echo "Release notes for ${TAG}: $(wc -l < "${RELEASE_NOTES}") lines from CHANGELOG.md ${heading}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      - name: Require signing and package-manager credentials for stable tags
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOMEBREW_TAP_APP_CLIENT_ID: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          HOMEBREW_TAP_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_SIGN_P12}" ] || [ -z "${MACOS_NOTARY_KEY}" ] || [ -z "${MACOS_NOTARY_KEY_ID}" ] || [ -z "${MACOS_NOTARY_ISSUER_ID}" ]; then
            echo "::error::Stable releases require the macOS signing secrets (MACOS_SIGN_P12, MACOS_NOTARY_ISSUER_ID, MACOS_NOTARY_KEY_ID, MACOS_NOTARY_KEY): the published cask has no quarantine workaround, so an unsigned darwin binary would not run"
            exit 1
          fi
          # MACOS_SIGN_P12_PASSWORD may legitimately be empty: the identity is
          # exported as a PKCS#12 without a passphrase. Both blobs must decode as
          # base64 (quill decodes them); the .p8 must be stored base64-encoded,
          # not as PEM text. Nothing here prints a value.
          if ! printf '%s' "${MACOS_SIGN_P12}" | base64 -d >/dev/null 2>&1 || ! printf '%s' "${MACOS_NOTARY_KEY}" | base64 -d >/dev/null 2>&1; then
            echo "::error::MACOS_SIGN_P12 and MACOS_NOTARY_KEY must be base64-encoded blobs (store the .p8 as base64, not PEM text)"
            exit 1
          fi
          if [ -z "${HOMEBREW_TAP_APP_CLIENT_ID}" ] || [ -z "${HOMEBREW_TAP_APP_PRIVATE_KEY}" ]; then
            echo "::error::Stable releases require the package-manager GitHub App: variable HOMEBREW_TAP_APP_CLIENT_ID and secret HOMEBREW_TAP_APP_PRIVATE_KEY in the release environment, for an App installed on anydoor7/homebrew-tap and anydoor7/scoop-bucket with Contents read/write"
            exit 1
          fi
          if [ -z "${WINGET_GITHUB_TOKEN}" ]; then
            echo "::error::Stable releases require WINGET_GITHUB_TOKEN in the release environment: an expiring classic PAT with only public_repo scope, push access to anydoor7/winget-pkgs, and permission to open PRs in microsoft/winget-pkgs"
            exit 1
          fi
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.44.0
      # The tap and bucket are separate repositories. Minting fails unless
      # this selected-repository App installation covers BOTH with Contents
      # write. The token expires after one hour and is revoked after the job.
      - name: Mint Homebrew tap and Scoop bucket token
        id: tap-token
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: anydoor7
          repositories: homebrew-tap,scoop-bucket
          permission-contents: write
      - name: Verify package-manager publisher access
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: python3 scripts/windows-publish-preflight.py
      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Must be >= 2.11 for the `homebrew_casks` config key and match the
          # version validated by the release-config gate. Kept identical to the
          # release-candidate `release-config` pin and the .goreleaser.yml comment.
          version: v2.17.0
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty on pre-release tags, where skip_upload: auto skips publishers.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          # macOS Developer ID signing + notarization (see .goreleaser.yml
          # `notarize`). Leaving MACOS_SIGN_P12 empty disables the step; the
          # stable-tag gate above refuses that, pre-release tags may run unsigned.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }} # base64 of the .p8
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Keep in sync with .goreleaser.yml release assets: installable
          # artifacts, checksums, SBOM sidecars, and Sigstore bundle sidecars.
          subject-path: |
            dist/checksums.txt
            dist/*.sigstore.json
            dist/*.sbom.json
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
