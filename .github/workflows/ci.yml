name: CI

# PR and main both run the exact-SHA release candidate gate defined in
# release-candidate.yml. There is no separate, weaker CI path: the same
# reusable workflow gates every trigger.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    name: Release candidate gate
    permissions:
      contents: read
    uses: ./.github/workflows/release-candidate.yml
    with:
      ref: ${{ github.sha }}
