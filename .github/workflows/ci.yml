name: CI

# Main and tags (via release.yml) run the full exact-SHA candidate gate.
# PRs run a tier chosen from changed paths, with a ci:full label override;
# draft PRs defer heavy checks. All paths finish at the aggregate gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft, labeled, unlabeled]

# Least privilege: the reusable candidate gate only reads the repository.
permissions:
  contents: read

# One run per ref. A new push to a PR branch cancels the superseded run
# instead of spending another three-OS matrix on a commit nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No `secrets:` here: release-candidate.yml declares and uses no secrets, and
  # release.yml calls the same workflow without passing any. Keeping the
  # PR-triggered call secret-free is the point -- a same-repo PR must not drag
  # the caller's secret scope behind it.
  candidate:
    name: Release candidate gate
    permissions:
      contents: read
    uses: ./.github/workflows/release-candidate.yml
    with:
      ref: ${{ github.sha }}
