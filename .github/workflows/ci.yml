name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: go test ./...
      - name: Race and coverage
        if: matrix.os == 'ubuntu-latest'
        run: go test ./... -race -coverprofile=coverage.out
      - name: Coverage floor
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go tool cover -func=coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          threshold="85.0"
          awk -v total="$total" -v threshold="$threshold" 'BEGIN {
            if (total + 0 < threshold + 0) {
              printf "coverage %.1f%% is below %.1f%%\n", total, threshold
              exit 1
            }
            printf "coverage %.1f%% meets %.1f%%\n", total, threshold
          }'

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: GoReleaser config check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi
          mkdir -p dist/cross
          go build -trimpath -o "dist/cross/tslink-${GOOS}-${GOARCH}${ext}" .
      - name: Smoke native artifact
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./dist/cross/tslink-linux-amd64 --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: tslink-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/cross/*
          if-no-files-found: error
