name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # actions/setup-go v6.4.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Native CLI smoke
        shell: bash
        run: |
          bin="dist/native/tslink"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            bin="${bin}.exe"
          fi
          mkdir -p dist/native
          go build -trimpath -o "$bin" .
          # Windows runs this in Git Bash; keep command splitting in bash and
          # add .exe above so one smoke list covers every runner OS.
          commands=(
            "--help"
            "login --help"
            "logout --help"
            "add --help"
            "remove --help"
            "list --help"
            "serve --help"
            "stop --help"
            "status --help"
            "logs --help"
            "api --help"
            "config --help"
            "config set --help"
            "config get --help"
            "config list --help"
            "tags --help"
            "tags list --help"
            "tags pull --help"
            "tags add --help"
            "tags set --help"
            "tags set-default --help"
            "tags delete-remote --help"
            "install --help"
            "uninstall --help"
          )
          for command in "${commands[@]}"; do
            read -r -a args <<< "$command"
            "$bin" "${args[@]}" >/dev/null
          done
      - name: Race tests (macOS/Windows)
        if: matrix.os == 'macos-latest' || matrix.os == 'windows-latest'
        run: go test ./... -race
      - name: Race and coverage
        if: matrix.os == 'ubuntu-latest'
        run: go test ./... -race -coverprofile=coverage.out
      - name: Coverage floor
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go tool cover -func=coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          threshold="85.0"
          awk -v total="$total" -v threshold="$threshold" 'BEGIN {
            if (total + 0 < threshold + 0) {
              printf "coverage %.1f%% is below %.1f%%\n", total, threshold
              exit 1
            }
            printf "coverage %.1f%% meets %.1f%%\n", total, threshold
          }'

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # actions/setup-go v6.4.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  release-config:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      # actions/setup-go v6.4.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - name: GoReleaser config check
        # goreleaser/goreleaser-action v6.4.0
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          version: v2.9.0
          args: check

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # actions/setup-go v6.4.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi
          mkdir -p dist/cross
          go build -trimpath -o "dist/cross/tslink-${GOOS}-${GOARCH}${ext}" .
      - name: Smoke native artifact
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./dist/cross/tslink-linux-amd64 --help >/dev/null
      # actions/upload-artifact v7.2.1
      - uses: actions/upload-artifact@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8
        with:
          name: tslink-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/cross/*
          if-no-files-found: error
