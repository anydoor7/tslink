<text x="48" y="72" fill="#12213A" font-size="36" font-weight="700" text-anchor="start">Your local model, within reach.</text>
<text x="48" y="111" fill="#536580" font-size="21" font-weight="400" text-anchor="start">Ask questions of documents with an app that runs on your machine.</text>
