<svg xmlns="http://www.w3.org/2000/svg" width="400" height="995" viewBox="0 0 400 995" fill="none" role="img" aria-labelledby="title desc">
<title id="title">TSLink: configuration and request paths</title>
<desc id="desc">TSLink system architecture, simplified private-service path. Dashed amber control arrows show service-management operations through CLI or MCP writing registry.json; the shared TSLink daemon watches the registry and reconciles one embedded tsnet node per service. Solid arrows show permitted tailnet devices exchanging requests and responses with these nodes: HTTP proxy for a local app or model API, file serving for documents, and raw TCP forwarding for a database. All nodes run inside one shared daemon with distinct identities. Tailnet policy governs reachability; HTTP and file services can additionally use an allow list. Raw TCP has no HTTP WhoIs layer. Target examples are local to the publishing machine.</desc>
