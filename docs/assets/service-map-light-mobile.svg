<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1080" width="400" height="1080" role="img" aria-labelledby="title desc">
<title id="title">TSLink: private app access and optional public sharing</title>
<desc id="desc">One PC, server or cloud host. Tailscale supplies encrypted private transport. Optional public HTTPS through Funnel serves HTTP proxy apps, with a guest link gate or explicitly open publication. CLI and MCP manage each host independently. No cross-host inventory or process isolation.</desc>
<rect width="400" height="1080" rx="18" fill="#F5F8FC"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" fill="#17253A">
<text x="24" y="38" font-size="25" font-weight="700" fill="#17253A">Your apps. Your access.</text>
<text x="24" y="66" font-size="17" font-weight="400" fill="#4A6078">Private first. Public only by choice.</text>
<rect x="24" y="90" width="352" height="92" rx="12" fill="#FFFFFF" stroke="#087E98" stroke-width="1.5"/>
<text x="40" y="119" font-size="19" font-weight="600" fill="#17253A">Your devices + named people</text>
<text x="40" y="145" font-size="16" font-weight="400" fill="#087E98">Tailscale • encrypted private transport</text>
<text x="40" y="169" font-size="16" font-weight="400" fill="#4A6078">Network policy + app permissions</text>
<rect x="24" y="204" width="352" height="106" rx="12" fill="#FFFFFF" stroke="#976400" stroke-width="1.5"/>
<text x="40" y="233" font-size="19" font-weight="600" fill="#17253A">Browser visitors • optional</text>
<text x="40" y="259" font-size="17" font-weight="400" fill="#976400">Public HTTPS / Tailscale Funnel</text>
<text x="40" y="284" font-size="16" font-weight="400" fill="#4A6078">Guest link + optional PIN, or open URL</text>
<rect x="24" y="340" width="352" height="520" rx="12" fill="#FFFFFF" stroke="#CDD9E6" stroke-width="1.5"/>
<text x="40" y="371" font-size="15" font-weight="700" fill="#4A6078">ONE APP HOST</text>
<text x="40" y="400" font-size="19" font-weight="600" fill="#17253A">Your PC, server or cloud machine</text>
<text x="40" y="427" font-size="16" font-weight="400" fill="#4A6078">Shared daemon • separate tsnet nodes</text>
<rect x="34" y="445" width="332" height="98" rx="12" fill="#FFFFFF" stroke="#087E98" stroke-width="1.5"/>
<text x="48" y="472" font-size="18" font-weight="600" fill="#087E98">Private service nodes</text>
<text x="48" y="498" font-size="16" font-weight="400" fill="#17253A">HTTPS → web apps, files, model APIs</text>
<text x="48" y="525" font-size="16" font-weight="400" fill="#17253A">Private TCP → database / TCP app</text>
<rect x="34" y="563" width="332" height="130" rx="12" fill="#FFFFFF" stroke="#976400" stroke-width="1.5"/>
<text x="48" y="590" font-size="17" font-weight="600" fill="#976400">Optional public HTTP proxy node</text>
<text x="48" y="618" font-size="17" font-weight="400" fill="#17253A">Guest gate → HTTP app</text>
<text x="48" y="644" font-size="16" font-weight="400" fill="#17253A">or explicit open publication → app</text>
<text x="48" y="673" font-size="15" font-weight="400" fill="#4A6078">No public raw TCP or file-service mode</text>
<text x="42" y="727" font-size="16" font-weight="600" fill="#17253A">Private home portal → permitted apps</text>
<text x="42" y="756" font-size="17" font-weight="400" fill="#17253A">Health checks + alerts</text>
<text x="42" y="783" font-size="17" font-weight="400" fill="#17253A">Access history + mutation audit</text>
<text x="42" y="830" font-size="16" font-weight="400" fill="#4A6078">App processes share this host.</text>
<rect x="24" y="899" width="352" height="93" rx="12" fill="#FFFFFF" stroke="#CDD9E6" stroke-width="1.5"/>
<text x="40" y="929" font-size="19" font-weight="600" fill="#17253A">You or an agent • CLI / MCP</text>
<text x="40" y="955" font-size="16" font-weight="400" fill="#4A6078">Registry + watcher • roles + app scopes</text>
<text x="40" y="979" font-size="16" font-weight="400" fill="#4A6078">Configure and inspect this host</text>
<polyline points="200,899 200,863" fill="none" stroke="#4A6078" stroke-width="2" stroke-dasharray="5 5"/>
<polyline points="195,869 200,863 205,869" fill="none" stroke="#4A6078" stroke-width="2"/>
<text x="24" y="1030" font-size="16" font-weight="400" fill="#4A6078">Repeat per host; no combined inventory.</text>
<text x="24" y="1056" font-size="15" font-weight="400" fill="#4A6078">Solid: access   Dashed: management</text>
<polyline points="376,136 389,136 389,455 366,455" fill="none" stroke="#087E98" stroke-width="2"/>
<polyline points="372,450 366,455 372,460" fill="none" stroke="#087E98" stroke-width="2"/>
<polyline points="24,257 11,257 11,592 34,592" fill="none" stroke="#976400" stroke-width="2"/>
<polyline points="28,587 34,592 28,597" fill="none" stroke="#976400" stroke-width="2"/>
</g></svg>
