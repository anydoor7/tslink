<text x="24" y="54" fill="#12213A" font-size="32" font-weight="700" text-anchor="start">Your tools.</text>
<text x="24" y="96" fill="#12213A" font-size="32" font-weight="700" text-anchor="start">Their own addresses.</text>
<text x="24" y="137" fill="#536580" font-size="20" font-weight="400" text-anchor="start">One service. One named node.</text>
