<svg xmlns="http://www.w3.org/2000/svg" width="400" height="823" viewBox="0 0 400 823" fill="none" role="img" aria-labelledby="title desc">
<title id="title">TSLink: distinct services, distinct nodes, one tailnet</title>
<desc id="desc">Illustrative TSLink service map. Four local services have distinct icons, colors, and named embedded Tailscale nodes within the same tailnet: App becomes app over HTTPS; Docs becomes docs over HTTPS; Database becomes database over private TCP; Model API becomes model over HTTPS. Phone, laptop, and agent clients connect as permitted by tailnet policy. Node names and localhost ports are examples. Separate nodes do not imply isolated host processes.</desc>
