<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="title desc">
<title id="title">TSLink: private app access and optional public sharing</title>
<desc id="desc">One PC, server or cloud host. Tailscale supplies encrypted private transport. Optional public HTTPS through Funnel serves HTTP proxy apps, with a guest link gate or explicitly open publication. CLI and MCP manage each host independently. No cross-host inventory or process isolation.</desc>
<rect width="960" height="700" rx="18" fill="#101A29"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" fill="#EDF3FC">
<text x="28" y="44" font-size="30" font-weight="700" fill="#EDF3FC">Your apps. Your access.</text>
<text x="28" y="74" font-size="18" font-weight="400" fill="#B9C8DA">Private first. Public only by choice.</text>
<rect x="350" y="104" width="582" height="466" rx="12" fill="#17253A" stroke="#40526B" stroke-width="1.5"/>
<text x="374" y="135" font-size="15" font-weight="700" fill="#B9C8DA">ONE APP HOST</text>
<text x="374" y="164" font-size="24" font-weight="600" fill="#EDF3FC">Your PC, server or cloud machine</text>
<text x="374" y="192" font-size="17" font-weight="400" fill="#B9C8DA">One shared daemon • a separate tsnet node per service</text>
<rect x="28" y="214" width="272" height="139" rx="12" fill="#17253A" stroke="#68D9EE" stroke-width="1.5"/>
<text x="46" y="245" font-size="21" font-weight="600" fill="#EDF3FC">Your devices</text>
<text x="46" y="272" font-size="21" font-weight="600" fill="#EDF3FC">+ named people</text>
<text x="46" y="301" font-size="17" font-weight="400" fill="#68D9EE">Tailscale • encrypted</text>
<text x="46" y="326" font-size="17" font-weight="400" fill="#B9C8DA">Private network policy</text>
<rect x="372" y="216" width="246" height="91" rx="12" fill="#17253A" stroke="#68D9EE" stroke-width="1.5"/>
<text x="388" y="245" font-size="18" font-weight="600" fill="#68D9EE">Private HTTPS nodes</text>
<text x="388" y="273" font-size="17" font-weight="400" fill="#EDF3FC">HTTP / file permissions</text>
<text x="388" y="295" font-size="15" font-weight="400" fill="#B9C8DA">Verified login when required</text>
<text x="680" y="250" font-size="19" font-weight="600" fill="#EDF3FC">Web apps • files</text>
<text x="680" y="278" font-size="19" font-weight="400" fill="#EDF3FC">Local model APIs</text>
<polyline points="300,263 372,263" fill="none" stroke="#68D9EE" stroke-width="2"/>
<polyline points="366,258 372,263 366,268" fill="none" stroke="#68D9EE" stroke-width="2"/>
<polyline points="618,263 662,263" fill="none" stroke="#68D9EE" stroke-width="2"/>
<polyline points="656,258 662,263 656,268" fill="none" stroke="#68D9EE" stroke-width="2"/>
<rect x="372" y="324" width="246" height="65" rx="12" fill="#17253A" stroke="#68D9EE" stroke-width="1.5"/>
<text x="388" y="350" font-size="18" font-weight="600" fill="#68D9EE">Private TCP node</text>
<text x="388" y="375" font-size="16" font-weight="400" fill="#B9C8DA">Policy + backend login</text>
<text x="680" y="363" font-size="19" font-weight="400" fill="#EDF3FC">Database / TCP app</text>
<polyline points="320,263 320,356 372,356" fill="none" stroke="#68D9EE" stroke-width="2"/>
<polyline points="366,351 372,356 366,361" fill="none" stroke="#68D9EE" stroke-width="2"/>
<polyline points="618,356 662,356" fill="none" stroke="#68D9EE" stroke-width="2"/>
<polyline points="656,351 662,356 656,361" fill="none" stroke="#68D9EE" stroke-width="2"/>
<rect x="28" y="410" width="272" height="143" rx="12" fill="#17253A" stroke="#F6BF50" stroke-width="1.5"/>
<text x="46" y="440" font-size="21" font-weight="600" fill="#EDF3FC">Browser visitors</text>
<text x="46" y="468" font-size="17" font-weight="400" fill="#F6BF50">Optional public access</text>
<text x="46" y="496" font-size="17" font-weight="400" fill="#EDF3FC">HTTPS / Tailscale Funnel</text>
<text x="46" y="525" font-size="16" font-weight="400" fill="#B9C8DA">Not private user identity</text>
<rect x="372" y="410" width="246" height="101" rx="12" fill="#17253A" stroke="#F6BF50" stroke-width="1.5"/>
<text x="388" y="438" font-size="17" font-weight="600" fill="#F6BF50">Public HTTP proxy node</text>
<text x="388" y="465" font-size="16" font-weight="400" fill="#EDF3FC">Guest link + optional PIN</text>
<text x="388" y="493" font-size="16" font-weight="400" fill="#EDF3FC">or explicitly open URL</text>
<text x="680" y="462" font-size="20" font-weight="600" fill="#EDF3FC">HTTP app</text>
<text x="680" y="489" font-size="16" font-weight="400" fill="#B9C8DA">No public raw TCP</text>
<polyline points="300,462 372,462" fill="none" stroke="#F6BF50" stroke-width="2"/>
<polyline points="366,457 372,462 366,467" fill="none" stroke="#F6BF50" stroke-width="2"/>
<polyline points="618,462 662,462" fill="none" stroke="#F6BF50" stroke-width="2"/>
<polyline points="656,457 662,462 656,467" fill="none" stroke="#F6BF50" stroke-width="2"/>
<text x="374" y="543" font-size="17" font-weight="400" fill="#EDF3FC">Private portal • health + alerts • access history + audit</text>
<rect x="28" y="596" width="590" height="73" rx="12" fill="#17253A" stroke="#40526B" stroke-width="1.5"/>
<text x="46" y="625" font-size="21" font-weight="600" fill="#EDF3FC">You or an agent • CLI / MCP</text>
<text x="46" y="652" font-size="17" font-weight="400" fill="#B9C8DA">Registry + watcher • roles + app scopes • configure and inspect</text>
<polyline points="618,632 644,632 644,575" fill="none" stroke="#B9C8DA" stroke-width="2" stroke-dasharray="5 5"/>
<polyline points="639,581 644,575 649,581" fill="none" stroke="#B9C8DA" stroke-width="2"/>
<text x="680" y="609" font-size="17" font-weight="400" fill="#B9C8DA">Repeat per host.</text>
<text x="680" y="634" font-size="17" font-weight="400" fill="#B9C8DA">No combined inventory.</text>
<text x="680" y="659" font-size="17" font-weight="400" fill="#B9C8DA">No process isolation.</text>
</g></svg>
