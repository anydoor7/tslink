<svg xmlns="http://www.w3.org/2000/svg" width="400" height="880" viewBox="0 0 400 880" fill="none" role="img" aria-labelledby="title desc">
<title id="title">TSLink local AI deployment example: your local model, within reach</title>
<desc id="desc">Local AI deployment example. A permitted phone, laptop, or agent sends requests and receives responses through encrypted tailnet transport and a TSLink HTTPS node. On the publishing machine, a separately configured local AI app reads local documents and calls a local model. TSLink provides the connection; the chosen application provides document handling and model inference. This example is conditional on configuring that application to use local data and a local model, and does not imply egress blocking or that a raw model API reads documents automatically.</desc>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
<rect x="0.5" y="0.5" width="399" height="879" rx="24" fill="#F5F8FC" stroke="#D7E0EC" stroke-width="1"/>
<text x="24" y="53" fill="#12213A" font-size="31" font-weight="700" text-anchor="start">Your local model,</text>
<text x="24" y="94" fill="#12213A" font-size="31" font-weight="700" text-anchor="start">within reach.</text>
<text x="24" y="131" fill="#536580" font-size="20" font-weight="400" text-anchor="start">An app, your documents,</text>
<text x="24" y="158" fill="#536580" font-size="20" font-weight="400" text-anchor="start">and a model on your machine.</text>
