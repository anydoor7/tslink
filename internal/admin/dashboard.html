<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSLink Admin</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3d;
    --accent: #5c6ef8;
    --accent-hover: #4a5ce6;
    --danger: #e85d5d;
    --danger-hover: #d44a4a;
    --text: #e2e4f0;
    --muted: #8b8fa8;
    --success: #4caf7d;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; }
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; gap: 12px; height: 56px; }
  .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
  .logo span { color: var(--accent); }
  .badge { background: var(--accent); color: #fff; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; letter-spacing: 0.5px; text-transform: uppercase; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .status-dot.running { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .status-text { color: var(--muted); font-size: 13px; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 24px; }
  .card-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); border-bottom: 1px solid var(--border); }
  td { padding: 12px 20px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .empty-row td { text-align: center; color: var(--muted); padding: 32px; }
  .type-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
  .type-proxy { background: rgba(92,110,248,0.15); color: #7a8ef8; }
  .type-file  { background: rgba(76,175,125,0.15); color: #4caf7d; }
  .type-tcp   { background: rgba(255,165,0,0.15);  color: #ffa94d; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: background 0.15s, opacity 0.15s; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 5px 10px; font-size: 12px; }
  .btn-danger:hover:not(:disabled) { background: var(--danger); color: #fff; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr 2fr auto; gap: 10px; align-items: end; padding: 16px 20px; }
  @media (max-width: 700px) { .form-grid { grid-template-columns: 1fr 1fr; } }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
  input, select { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 8px 10px; font-size: 13px; font-family: var(--font); width: 100%; transition: border-color 0.15s; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  select option { background: var(--surface); }
  #toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 500; opacity: 0; transform: translateY(8px); transition: opacity 0.2s, transform 0.2s; pointer-events: none; max-width: 320px; z-index: 999; }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.ok  { background: var(--success); color: #fff; }
  #toast.err { background: var(--danger);  color: #fff; }
  .stats { display: flex; gap: 16px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; flex: 1; }
  .stat-value { font-size: 28px; font-weight: 700; color: var(--text); }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .refresh-info { font-size: 12px; color: var(--muted); }
  .svc-name { font-weight: 600; }
  .svc-target { font-family: monospace; font-size: 12px; }
  .svc-created { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header class="header">
  <div class="logo">TS<span>Link</span></div>
  <span class="badge">Admin</span>
  <div class="header-right">
    <span class="status-dot" id="statusDot"></span>
    <span class="status-text" id="statusText">loading…</span>
  </div>
</header>
<main>
  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="svcCount">—</div>
      <div class="stat-label">Services</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="uptimeVal">—</div>
      <div class="stat-label">Uptime</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">Add Service</span>
    </div>
    <form id="addForm">
      <div class="form-grid">
        <div class="form-group">
          <label for="svcName">Name</label>
          <input id="svcName" name="name" placeholder="my-app" required pattern="[a-z0-9][a-z0-9\-]*[a-z0-9]|[a-z0-9]">
        </div>
        <div class="form-group">
          <label for="svcType">Type</label>
          <select id="svcType" name="type" required>
            <option value="proxy">Proxy</option>
            <option value="file">File</option>
            <option value="tcp">TCP</option>
          </select>
        </div>
        <div class="form-group">
          <label for="svcTarget" id="targetLabel">Target / URL</label>
          <input id="svcTarget" name="target" placeholder="localhost:3000" required>
        </div>
        <button type="submit" class="btn btn-primary" id="addBtn">Add</button>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">Services</span>
      <span class="refresh-info">auto-refresh 5s</span>
    </div>
    <table id="servicesTable">
      <thead>
        <tr>
          <th>Name</th><th>Type</th><th>Target / Path</th><th>Created</th><th></th>
        </tr>
      </thead>
      <tbody id="servicesTbody"></tbody>
    </table>
  </div>
</main>
<div id="toast"></div>

<script>
(function() {
  'use strict';

  var placeholders = { proxy: 'localhost:3000', file: '/path/to/dir', tcp: 'host:port' };
  var targetLabels = { proxy: 'Target URL', file: 'Directory Path', tcp: 'Host:Port' };

  function t(id) { return document.getElementById(id); }

  t('svcType').addEventListener('change', function() {
    var v = this.value;
    t('svcTarget').placeholder = placeholders[v] || '';
    t('targetLabel').textContent = targetLabels[v] || 'Target';
  });

  function showToast(msg, type) {
    var el = t('toast');
    el.textContent = msg;
    el.className = 'show ' + type;
    clearTimeout(el._tid);
    el._tid = setTimeout(function() { el.className = ''; }, 3500);
  }

  function setServiceCount(n) {
    t('svcCount').textContent = String(n);
  }

  function renderEmpty(msg) {
    var tbody = t('servicesTbody');
    while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
    var tr = document.createElement('tr');
    tr.className = 'empty-row';
    var td = document.createElement('td');
    td.setAttribute('colspan', '5');
    td.textContent = msg;
    tr.appendChild(td);
    tbody.appendChild(tr);
  }

  function createRemoveButton(name) {
    var btn = document.createElement('button');
    btn.className = 'btn btn-danger';
    btn.textContent = 'Remove';
    btn.addEventListener('click', function() { removeService(name); });
    return btn;
  }

  function renderServices(services) {
    var tbody = t('servicesTbody');
    while (tbody.firstChild) tbody.removeChild(tbody.firstChild);

    if (!services || services.length === 0) {
      renderEmpty('No services registered yet.');
      return;
    }

    services.forEach(function(s) {
      var target = s.target || s.path || (s.port ? ':' + String(s.port) : '—');
      var created = s.created_at ? new Date(s.created_at).toLocaleString() : '—';

      var tr = document.createElement('tr');

      var tdName = document.createElement('td');
      tdName.className = 'svc-name';
      tdName.textContent = s.name;

      var tdType = document.createElement('td');
      var badge = document.createElement('span');
      badge.className = 'type-badge type-' + (s.type || 'proxy');
      badge.textContent = s.type || '';
      tdType.appendChild(badge);

      var tdTarget = document.createElement('td');
      tdTarget.className = 'svc-target';
      tdTarget.textContent = target;

      var tdCreated = document.createElement('td');
      tdCreated.className = 'svc-created';
      tdCreated.textContent = created;

      var tdAction = document.createElement('td');
      tdAction.appendChild(createRemoveButton(s.name));

      tr.appendChild(tdName);
      tr.appendChild(tdType);
      tr.appendChild(tdTarget);
      tr.appendChild(tdCreated);
      tr.appendChild(tdAction);
      tbody.appendChild(tr);
    });
  }

  async function loadStatus() {
    try {
      var res = await fetch('/api/status');
      var data = await res.json();
      if (data.ok && data.data) {
        var d = data.data;
        var dot = t('statusDot');
        dot.className = 'status-dot' + (d.running ? ' running' : '');
        t('statusText').textContent = d.running ? 'Daemon running' : 'Daemon stopped';
        setServiceCount(d.service_count);
        t('uptimeVal').textContent = d.uptime || '—';
      }
    } catch(_) {}
  }

  async function loadServices() {
    try {
      var res = await fetch('/api/services');
      var data = await res.json();
      if (!data.ok || !data.data) {
        renderEmpty('No services registered yet.');
        return;
      }
      renderServices(data.data);
    } catch(_) {
      renderEmpty('Failed to load services.');
    }
  }

  t('addForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = t('addBtn');
    var body = {};
    new FormData(this).forEach(function(v, k) { body[k] = v; });
    btn.disabled = true;
    btn.textContent = 'Adding…';
    try {
      var res = await fetch('/api/services', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      var data = await res.json();
      if (data.ok) {
        showToast('Service added: ' + body.name, 'ok');
        e.target.reset();
        await refresh();
      } else {
        showToast(data.error || 'Failed to add service', 'err');
      }
    } catch(_) {
      showToast('Network error', 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Add';
    }
  });

  async function removeService(name) {
    if (!confirm('Remove service "' + name + '"?')) return;
    try {
      var res = await fetch('/api/services/' + encodeURIComponent(name), { method: 'DELETE' });
      var data = await res.json();
      if (data.ok) {
        showToast('Removed: ' + name, 'ok');
        await refresh();
      } else {
        showToast(data.error || 'Failed to remove', 'err');
      }
    } catch(_) {
      showToast('Network error', 'err');
    }
  }

  async function refresh() {
    await Promise.all([loadStatus(), loadServices()]);
  }

  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
